<svg viewBox="0 0 700 210" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="210" fill="#1e1e1e" rx="10"/>
  <text x="350" y="28" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">Cut &amp; Final Result</text>

  <g font-size="17" fill="#f2f2f2" text-anchor="middle">
    <rect x="30" y="70" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="57" y="98">4</text>
    <rect x="140" y="70" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="167" y="98">5</text>
    <rect x="250" y="70" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="277" y="98">1</text>
    <rect x="360" y="70" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="387" y="98">2</text>
    <rect x="470" y="70" width="55" height="45" rx="7" fill="#3a2d2d" stroke="#e07a5f" stroke-width="2.5"/><text x="497" y="98">3</text>
  </g>
  <g stroke="#5b8def" stroke-width="2" marker-end="url(#a5)">
    <line x1="85" y1="92" x2="136" y2="92"/>
    <line x1="195" y1="92" x2="246" y2="92"/>
    <line x1="305" y1="92" x2="356" y2="92"/>
    <line x1="415" y1="92" x2="466" y2="92"/>
  </g>
  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/>
    </marker>
  </defs>
  <text x="565" y="98" fill="#888" font-size="14">→ NULL</text>
  <line x1="525" y1="92" x2="558" y2="92" stroke="#5b8def" stroke-width="2" marker-end="url(#a5)"/>

  <text x="57" y="60" fill="#f2c94c" font-size="13" text-anchor="middle" font-weight="bold">new head</text>
  <text x="497" y="60" fill="#e07a5f" font-size="13" text-anchor="middle" font-weight="bold">newHead.next = null (cut)</text>

  <text x="350" y="160" fill="#ccc" font-size="13" text-anchor="middle">head = newHead.next (node 4)   |   newHead.next = null (breaks the circle)</text>
  <text x="350" y="182" fill="#6fcf97" font-size="14" text-anchor="middle" font-weight="bold">Final list: 4 → 5 → 1 → 2 → 3</text>
</svg>
