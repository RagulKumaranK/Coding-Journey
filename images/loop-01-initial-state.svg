<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="220" fill="#1e1e1e" rx="10"/>
  <text x="350" y="28" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">Initial State — slow and fast both start at head</text>

  <!-- nodes -->
  <g font-size="17" fill="#f2f2f2" text-anchor="middle">
    <rect x="40" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/>
    <text x="67" y="108">1</text>
    <rect x="150" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/>
    <text x="177" y="108">2</text>
    <rect x="260" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/>
    <text x="287" y="108">3</text>
    <rect x="370" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/>
    <text x="397" y="108">4</text>
    <rect x="480" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/>
    <text x="507" y="108">5</text>
  </g>

  <!-- forward arrows -->
  <g stroke="#5b8def" stroke-width="2" marker-end="url(#a1)">
    <line x1="95" y1="102" x2="146" y2="102"/>
    <line x1="205" y1="102" x2="256" y2="102"/>
    <line x1="315" y1="102" x2="366" y2="102"/>
    <line x1="425" y1="102" x2="476" y2="102"/>
  </g>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e07a5f"/>
    </marker>
  </defs>

  <!-- loop back arrow (dim, not yet relevant) -->
  <path d="M507,125 C507,165 287,165 287,129" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- pointer labels -->
  <text x="67" y="65" fill="#6fcf97" font-size="14" text-anchor="middle" font-weight="bold">slow</text>
  <text x="67" y="150" fill="#f2c94c" font-size="14" text-anchor="middle" font-weight="bold">fast</text>
  <line x1="67" y1="70" x2="67" y2="76" stroke="#6fcf97" stroke-width="2"/>
  <line x1="67" y1="144" x2="67" y2="128" stroke="#f2c94c" stroke-width="2"/>

  <text x="350" y="195" fill="#ccc" font-size="13" text-anchor="middle">slow = head (node 1)   fast = head (node 1)</text>
</svg>
