<svg viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="200" fill="#1e1e1e" rx="10"/>
  <text x="380" y="26" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">Initial Sorted Doubly Linked List (with duplicates)</text>

  <g font-size="15" fill="#f2f2f2" text-anchor="middle">
    <rect x="20" y="80" width="55" height="45" rx="7" fill="#3a2d2d" stroke="#e07a5f" stroke-width="2.5"/><text x="47" y="108">1</text>
    <rect x="140" y="80" width="55" height="45" rx="7" fill="#3a2d2d" stroke="#e07a5f" stroke-width="2.5"/><text x="167" y="108">1</text>
    <rect x="260" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="287" y="108">2</text>
    <rect x="380" y="80" width="55" height="45" rx="7" fill="#3a2d2d" stroke="#e07a5f" stroke-width="2.5"/><text x="407" y="108">3</text>
    <rect x="500" y="80" width="55" height="45" rx="7" fill="#3a2d2d" stroke="#e07a5f" stroke-width="2.5"/><text x="527" y="108">3</text>
    <rect x="620" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="647" y="108">4</text>
  </g>

  <g stroke="#5b8def" stroke-width="1.8" marker-end="url(#af)">
    <line x1="75" y1="93" x2="136" y2="93"/>
    <line x1="195" y1="93" x2="256" y2="93"/>
    <line x1="315" y1="93" x2="376" y2="93"/>
    <line x1="435" y1="93" x2="496" y2="93"/>
    <line x1="555" y1="93" x2="616" y2="93"/>
  </g>
  <g stroke="#f2c94c" stroke-width="1.8" marker-end="url(#ab)">
    <line x1="136" y1="112" x2="75" y2="112"/>
    <line x1="256" y1="112" x2="195" y2="112"/>
    <line x1="376" y1="112" x2="315" y2="112"/>
    <line x1="496" y1="112" x2="435" y2="112"/>
    <line x1="616" y1="112" x2="555" y2="112"/>
  </g>
  <defs>
    <marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f2c94c"/></marker>
  </defs>

  <text x="47" y="65" fill="#f2c94c" font-size="13" text-anchor="middle" font-weight="bold">temp / head</text>

  <text x="380" y="165" fill="#ccc" font-size="12" text-anchor="middle">Sorted list means duplicates are always adjacent — only need to compare temp with temp.next</text>
</svg>
