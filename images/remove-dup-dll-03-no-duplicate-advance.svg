<svg viewBox="0 0 700 190" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="190" fill="#1e1e1e" rx="10"/>
  <text x="350" y="26" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">No Duplicate — temp simply advances</text>

  <g font-size="15" fill="#f2f2f2" text-anchor="middle">
    <rect x="150" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="177" y="108">1</text>
    <rect x="300" y="80" width="55" height="45" rx="7" fill="#2d3a2d" stroke="#6fcf97" stroke-width="2.5"/><text x="327" y="108">2</text>
    <rect x="450" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="477" y="108">3</text>
  </g>

  <g stroke="#5b8def" stroke-width="1.8" marker-end="url(#an)">
    <line x1="205" y1="93" x2="296" y2="93"/>
    <line x1="355" y1="93" x2="446" y2="93"/>
  </g>
  <defs>
    <marker id="an" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/></marker>
  </defs>

  <text x="177" y="65" fill="#888" font-size="12" text-anchor="middle">temp (before)</text>
  <text x="327" y="65" fill="#6fcf97" font-size="13" text-anchor="middle" font-weight="bold">temp (after: temp = temp.next)</text>

  <text x="350" y="150" fill="#ccc" font-size="12" text-anchor="middle">temp.data (1) != temp.next.data (2) → nothing to remove, just move forward</text>
</svg>
