  </defs>

  <text x="55" y="60" fill="#f2c94c" font-size="13" text-anchor="middle" font-weight="bold">prev</text>
  <text x="177" y="60" fill="#e07a5f" font-size="13" text-anchor="middle" font-weight="bold">first</text>
  <text x="287" y="60" fill="#6fcf97" font-size="13" text-anchor="middle" font-weight="bold">second</text>

  <text x="350" y="155" fill="#ccc" font-size="13" text-anchor="middle">first = node 1, second = node 2 — this pair is about to be swapped</text>
