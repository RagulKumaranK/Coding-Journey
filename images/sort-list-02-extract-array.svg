<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="260" fill="#1e1e1e" rx="10"/>
  <text x="350" y="28" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">Extract Values into an ArrayList</text>

  <g font-size="17" fill="#f2f2f2" text-anchor="middle">
    <rect x="80" y="60" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="107" y="88">4</text>
    <rect x="190" y="60" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="217" y="88">2</text>
    <rect x="300" y="60" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="327" y="88">1</text>
    <rect x="410" y="60" width="55" height="45" rx="7" fill="#3a2d2d" stroke="#e07a5f" stroke-width="2.5"/><text x="437" y="88">3</text>
  </g>
  <g stroke="#5b8def" stroke-width="2" marker-end="url(#a2)">
    <line x1="135" y1="82" x2="186" y2="82"/>
    <line x1="245" y1="82" x2="296" y2="82"/>
    <line x1="355" y1="82" x2="406" y2="82"/>
  </g>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/>
    </marker>
  </defs>
  <text x="437" y="50" fill="#e07a5f" font-size="13" text-anchor="middle" font-weight="bold">temp (reaches NULL after)</text>

  <!-- array below -->
  <text x="60" y="150" fill="#f2f2f2" font-size="14" font-weight="bold">arr =</text>
  <g font-size="17" fill="#f2f2f2" text-anchor="middle">
    <rect x="120" y="128" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="147" y="156">4</text>
    <rect x="185" y="128" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="212" y="156">2</text>
    <rect x="250" y="128" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="277" y="156">1</text>
    <rect x="315" y="128" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="342" y="156">3</text>
  </g>

  <text x="350" y="210" fill="#ccc" font-size="13" text-anchor="middle">while(temp != null) { arr.add(temp.val); temp = temp.next; }</text>
  <text x="350" y="232" fill="#ccc" font-size="13" text-anchor="middle">arr = [4, 2, 1, 3]  (list order preserved, values copied out)</text>
</svg>
