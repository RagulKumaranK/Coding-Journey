<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="240" fill="#1e1e1e" rx="10"/>
  <text x="350" y="28" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">Make the List Circular</text>

  <g font-size="17" fill="#f2f2f2" text-anchor="middle">
    <rect x="30" y="70" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="57" y="98">1</text>
    <rect x="140" y="70" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="167" y="98">2</text>
    <rect x="250" y="70" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="277" y="98">3</text>
    <rect x="360" y="70" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="387" y="98">4</text>
    <rect x="470" y="70" width="55" height="45" rx="7" fill="#3a2d2d" stroke="#e07a5f" stroke-width="2.5"/><text x="497" y="98">5</text>
  </g>
  <g stroke="#5b8def" stroke-width="2" marker-end="url(#a3)">
    <line x1="85" y1="92" x2="136" y2="92"/>
    <line x1="195" y1="92" x2="246" y2="92"/>
    <line x1="305" y1="92" x2="356" y2="92"/>
    <line x1="415" y1="92" x2="466" y2="92"/>
  </g>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/>
    </marker>
    <marker id="a3r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e07a5f"/>
    </marker>
  </defs>

  <!-- tail.next = head, circular arrow -->
  <path d="M497,115 C497,175 57,175 57,119" fill="none" stroke="#e07a5f" stroke-width="2.5" marker-end="url(#a3r)"/>
  <text x="277" y="195" fill="#e07a5f" font-size="12" text-anchor="middle">tail.next = head  (new link, list is now circular)</text>

  <text x="57" y="60" fill="#6fcf97" font-size="13" text-anchor="middle" font-weight="bold">head</text>
  <text x="497" y="60" fill="#e07a5f" font-size="13" text-anchor="middle" font-weight="bold">tail</text>

  <text x="350" y="222" fill="#ccc" font-size="13" text-anchor="middle">k = k % len = 2 % 5 = 2 (guards against k larger than len)</text>
</svg>
