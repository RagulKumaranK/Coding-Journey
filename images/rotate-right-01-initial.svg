  <text x="57" y="60" fill="#f2c94c" font-size="13" text-anchor="middle" font-weight="bold">head</text>
  <line x1="57" y1="63" x2="57" y2="68" stroke="#f2c94c" stroke-width="2"/>

  <text x="350" y="155" fill="#ccc" font-size="13" text-anchor="middle">Goal: rotate the list right by k=2 → last 2 nodes move to the front</text>
