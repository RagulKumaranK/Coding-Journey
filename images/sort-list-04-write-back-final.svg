<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="200" fill="#1e1e1e" rx="10"/>
  <text x="350" y="28" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">Write Sorted Values Back into the Same Nodes</text>

  <g font-size="17" fill="#f2f2f2" text-anchor="middle">
    <rect x="80" y="75" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="107" y="103">1</text>
    <rect x="190" y="75" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="217" y="103">2</text>
    <rect x="300" y="75" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="327" y="103">3</text>
    <rect x="410" y="75" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="437" y="103">4</text>
  </g>
  <g stroke="#5b8def" stroke-width="2" marker-end="url(#a4)">
    <line x1="135" y1="97" x2="186" y2="97"/>
    <line x1="245" y1="97" x2="296" y2="97"/>
    <line x1="355" y1="97" x2="406" y2="97"/>
  </g>
  <text x="530" y="103" fill="#888" font-size="14">→ NULL</text>
  <line x1="465" y1="97" x2="523" y2="97" stroke="#5b8def" stroke-width="2" marker-end="url(#a4)"/>
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/>
    </marker>
  </defs>

  <text x="350" y="60" fill="#ccc" font-size="12" text-anchor="middle">same nodes, same links — only .val fields were overwritten with arr[0..n-1]</text>
  <text x="350" y="165" fill="#6fcf97" font-size="14" text-anchor="middle" font-weight="bold">Final sorted list: 1 → 2 → 3 → 4</text>
</svg>
