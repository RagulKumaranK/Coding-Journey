<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="300" fill="#1e1e1e" rx="10"/>
  <text x="350" y="28" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">Detection Phase — slow +1, fast +2 each iteration</text>

  <!-- base list -->
  <g font-size="17" fill="#f2f2f2" text-anchor="middle">
    <rect x="40" y="60" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/>
    <text x="67" y="88">1</text>
    <rect x="150" y="60" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/>
    <text x="177" y="88">2</text>
    <rect x="260" y="60" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/>
    <text x="287" y="88">3</text>
    <rect x="370" y="60" width="55" height="45" rx="7" fill="#3a2d2d" stroke="#e07a5f" stroke-width="2.5"/>
    <text x="397" y="88">4</text>
    <rect x="480" y="60" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/>
    <text x="507" y="88">5</text>
  </g>
  <g stroke="#5b8def" stroke-width="2" marker-end="url(#a3)">
    <line x1="95" y1="82" x2="146" y2="82"/>
    <line x1="205" y1="82" x2="256" y2="82"/>
    <line x1="315" y1="82" x2="366" y2="82"/>
    <line x1="425" y1="82" x2="476" y2="82"/>
  </g>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/>
    </marker>
  </defs>
  <path d="M507,105 C507,145 287,145 287,109" fill="none" stroke="#e07a5f" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- iteration table -->
  <g font-size="14" fill="#ccc">
    <text x="60" y="180" fill="#f2f2f2" font-weight="bold">Iteration</text>
    <text x="220" y="180" fill="#6fcf97" font-weight="bold">slow</text>
    <text x="340" y="180" fill="#f2c94c" font-weight="bold">fast</text>
    <text x="460" y="180" fill="#ccc" font-weight="bold">meet?</text>

    <line x1="30" y1="190" x2="620" y2="190" stroke="#444"/>

    <text x="60" y="215">1</text>
    <text x="220" y="215">node 2</text>
    <text x="340" y="215">node 3</text>
    <text x="460" y="215">no</text>

    <text x="60" y="243">2</text>
    <text x="220" y="243">node 3</text>
    <text x="340" y="243">node 5</text>
    <text x="460" y="243">no</text>

    <text x="60" y="271">3</text>
    <text x="220" y="271" fill="#f2c94c" font-weight="bold">node 4</text>
    <text x="340" y="271" fill="#f2c94c" font-weight="bold">node 4</text>
    <text x="460" y="271" fill="#e07a5f" font-weight="bold">YES ✔</text>
  </g>
</svg>
