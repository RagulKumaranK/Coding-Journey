<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="260" fill="#1e1e1e" rx="10"/>
  <text x="350" y="28" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">Pass 1 — Create Clone Nodes &amp; Map Original → Clone</text>

  <!-- original row -->
  <g font-size="15" fill="#f2f2f2" text-anchor="middle">
    <rect x="60" y="60" width="90" height="45" rx="8" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="105" y="88">A (val 1)</text>
    <rect x="290" y="60" width="90" height="45" rx="8" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="335" y="88">B (val 2)</text>
    <rect x="520" y="60" width="90" height="45" rx="8" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="565" y="88">C (val 3)</text>
  </g>
  <g stroke="#5b8def" stroke-width="2" marker-end="url(#a2)">
    <line x1="150" y1="82" x2="286" y2="82"/>
    <line x1="380" y1="82" x2="516" y2="82"/>
  </g>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/>
    </marker>
    <marker id="a2m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#f2c94c"/>
    </marker>
  </defs>

  <!-- map arrows (dotted, down to clones) -->
  <line x1="105" y1="105" x2="105" y2="150" stroke="#f2c94c" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a2m)"/>
  <line x1="335" y1="105" x2="335" y2="150" stroke="#f2c94c" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a2m)"/>
  <line x1="565" y1="105" x2="565" y2="150" stroke="#f2c94c" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#a2m)"/>
  <text x="150" y="130" fill="#f2c94c" font-size="11">map.put(orig, clone)</text>

  <!-- clone row (no links yet) -->
  <g font-size="15" fill="#f2f2f2" text-anchor="middle">
    <rect x="60" y="155" width="90" height="45" rx="8" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="105" y="183">A' (val 1)</text>
    <rect x="290" y="155" width="90" height="45" rx="8" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="335" y="183">B' (val 2)</text>
    <rect x="520" y="155" width="90" height="45" rx="8" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="565" y="183">C' (val 3)</text>
  </g>
  <text x="350" y="222" fill="#ccc" font-size="12" text-anchor="middle">clones created with new Node(val) — next and random still unset (null)</text>
  <text x="350" y="244" fill="#ccc" font-size="12" text-anchor="middle">map = { A→A', B→B', C→C' }</text>
</svg>
