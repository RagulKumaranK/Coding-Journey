<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="220" fill="#1e1e1e" rx="10"/>
  <text x="350" y="26" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">Second Duplicate — same handling, later in the list</text>

  <g font-size="15" fill="#f2f2f2" text-anchor="middle">
    <rect x="60" y="80" width="55" height="45" rx="7" fill="#2d3a2d" stroke="#6fcf97" stroke-width="2.5"/><text x="87" y="108">3</text>
    <rect x="260" y="80" width="55" height="45" rx="7" fill="#3a2d2d" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="4,3"/><text x="287" y="108">3</text>
    <rect x="460" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="487" y="108">4</text>
  </g>

  <line x1="115" y1="93" x2="256" y2="93" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>

  <path d="M115,105 C220,140 350,140 460,105" fill="none" stroke="#5b8def" stroke-width="2.2" marker-end="url(#a2f)"/>
  <path d="M460,120 C350,155 220,155 115,120" fill="none" stroke="#f2c94c" stroke-width="2.2" marker-end="url(#a2p)"/>
  <defs>
    <marker id="a2f" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/></marker>
    <marker id="a2p" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f2c94c"/></marker>
  </defs>

  <text x="87" y="65" fill="#6fcf97" font-size="13" text-anchor="middle" font-weight="bold">temp (stays here)</text>
  <text x="287" y="65" fill="#e07a5f" font-size="12" text-anchor="middle">duplicate — being skipped</text>

  <text x="350" y="170" fill="#5b8def" font-size="12" text-anchor="middle">temp.next = temp.next.next</text>
  <text x="350" y="192" fill="#f2c94c" font-size="12" text-anchor="middle">temp.next.prev = temp</text>
</svg>
