<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="220" fill="#1e1e1e" rx="10"/>
  <text x="350" y="26" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">Case 3: temp.next == null → deleting the TAIL node</text>

  <g font-size="15" fill="#f2f2f2" text-anchor="middle">
    <rect x="330" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2.5"/><text x="357" y="108">4</text>
    <rect x="480" y="80" width="55" height="45" rx="7" fill="#3a2d2d" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="4,3"/><text x="507" y="108">2</text>
  </g>

  <line x1="385" y1="93" x2="476" y2="93" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="430" y="82" fill="#888" font-size="11" text-anchor="middle">old link (removed)</text>

  <text x="600" y="98" fill="#888" font-size="13">→ NULL</text>
  <line x1="385" y1="93" x2="596" y2="93" stroke="#5b8def" stroke-width="2" marker-end="url(#at)" stroke-dasharray="0"/>
  <defs>
    <marker id="at" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/></marker>
  </defs>

  <text x="357" y="65" fill="#6fcf97" font-size="13" text-anchor="middle" font-weight="bold">new tail</text>
  <text x="507" y="65" fill="#e07a5f" font-size="12" text-anchor="middle">temp (being deleted)</text>

  <text x="357" y="150" fill="#5b8def" font-size="12" text-anchor="middle">temp.prev.next = null</text>
  <text x="357" y="172" fill="#f2c94c" font-size="12" text-anchor="middle">temp.prev = null  (fully isolates the deleted node)</text>
</svg>
