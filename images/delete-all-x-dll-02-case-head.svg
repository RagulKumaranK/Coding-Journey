<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="220" fill="#1e1e1e" rx="10"/>
  <text x="350" y="26" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">Case 1: temp.prev == null → deleting the HEAD node</text>

  <g font-size="15" fill="#f2f2f2" text-anchor="middle">
    <rect x="30" y="80" width="55" height="45" rx="7" fill="#3a2d2d" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="4,3"/><text x="57" y="108">2</text>
    <rect x="180" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2.5"/><text x="207" y="108">1</text>
    <rect x="330" y="80" width="55" height="45" rx="7" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="357" y="108">3</text>
  </g>

  <line x1="85" y1="93" x2="176" y2="93" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="130" y="82" fill="#888" font-size="11" text-anchor="middle">old link (removed)</text>

  <line x1="235" y1="93" x2="326" y2="93" stroke="#5b8def" stroke-width="1.8" marker-end="url(#ah)"/>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/></marker>
    <marker id="ahx" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e07a5f"/></marker>
  </defs>

  <text x="57" y="65" fill="#e07a5f" font-size="12" text-anchor="middle">temp (being deleted)</text>
  <text x="207" y="65" fill="#6fcf97" font-size="13" text-anchor="middle" font-weight="bold">new head</text>

  <text x="207" y="140" fill="#f2c94c" font-size="12" text-anchor="middle">head.prev = null</text>

  <text x="350" y="175" fill="#ccc" font-size="12" text-anchor="middle">head = temp.next (node 1)   |   if (head != null) head.prev = null</text>
  <text x="350" y="197" fill="#ccc" font-size="12" text-anchor="middle">Node A is fully detached — no dangling references left behind</text>
</svg>
