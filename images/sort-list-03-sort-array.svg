<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="220" fill="#1e1e1e" rx="10"/>
  <text x="350" y="28" fill="#f2f2f2" font-size="15" font-weight="bold" text-anchor="middle">Sort the Array</text>

  <text x="90" y="90" fill="#f2f2f2" font-size="14" font-weight="bold">before:</text>
  <g font-size="16" fill="#f2f2f2" text-anchor="middle">
    <rect x="150" y="68" width="50" height="42" rx="6" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="175" y="94">4</text>
    <rect x="210" y="68" width="50" height="42" rx="6" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="235" y="94">2</text>
    <rect x="270" y="68" width="50" height="42" rx="6" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="295" y="94">1</text>
    <rect x="330" y="68" width="50" height="42" rx="6" fill="#2d2d2d" stroke="#888" stroke-width="1.5"/><text x="355" y="94">3</text>
  </g>

  <path d="M400,90 L460,90" stroke="#5b8def" stroke-width="2.5" marker-end="url(#a3)"/>
  <text x="430" y="75" fill="#5b8def" font-size="12" text-anchor="middle">sort</text>
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5b8def"/>
    </marker>
  </defs>

  <text x="500" y="90" fill="#f2f2f2" font-size="14" font-weight="bold">after:</text>
  <g font-size="16" fill="#f2f2f2" text-anchor="middle">
    <rect x="555" y="68" width="50" height="42" rx="6" fill="#2d2d2d" stroke="#6fcf97" stroke-width="2"/><text x="580" y="94">1</text>
  </g>
  <text x="350" y="140" fill="#ccc" font-size="13" text-anchor="middle">Collections.sort(arr)</text>
  <text x="350" y="165" fill="#6fcf97" font-size="14" text-anchor="middle" font-weight="bold">arr = [1, 2, 3, 4]</text>
  <text x="350" y="190" fill="#ccc" font-size="12" text-anchor="middle">(Java's built-in sort — Timsort, O(N log N))</text>
</svg>
